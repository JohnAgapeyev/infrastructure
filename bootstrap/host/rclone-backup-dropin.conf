# /etc/systemd/system/rclone-backup.service.d/override.conf
# Phase 8: extend the existing backup pipeline with /srv/appdata.
# The two original ExecStart lines in rclone-backup.service stay untouched;
# this drop-in ADDS a snapshot pre-step and a third ExecStart (oneshot
# services may list several). B2 lifecycle rules version overwritten files.
#
# Exclusions, beyond the plan's (prometheus, jellyfin-cache, logs, wal/shm):
# - *.db-journal / *.db3-journal: SQLite rollback journals can vanish mid-copy
# - qbittorrent ipc-socket: unix socket, not a regular file (rclone refuses)
# - live copies of the snapshotted DBs (grafana, shoko SQLite, jellyfin,
#   seerr, bazarr, home-assistant): these are written while being uploaded,
#   which caused "corrupted on transfer: sha1 hashes differ" failures. The
#   consistent copies in _snapshots/ are the restore source for these files.
# - sonarr/radarr/prowlarr live DBs (NC-3 fix, 2026-10-13): same failure
#   class - sonarr was mid-4K-downgrade-waves during the sync window and
#   its sonarr.db/logs.db hit "source file is being updated" + sha1
#   mismatch on all 3 retries. Restore source = their own weekly zips in
#   <app>/Backups/ (still synced) + a fresh export if ever needed.
# - jellyfin/Shokofin/VFS/**: Shokofin materializes its VFS library inside
#   the Jellyfin config dir - 5057 SYMLINKS into /srv/Media/Anime. The
#   media itself never uploads (rclone refuses symlinks without -L) but
#   every entry logged "Can't follow symlink" and slowed each retry pass;
#   the tree is generated state, regenerable from Shoko.
# - postgres/** (NC-3): live PG cluster files are useless as a copy; the
#   consistent pg_dump in _snapshots/nextcloud/ is the DB restore source.
# - nextcloud-data/nextcloud.log + uploads/** + appdata_*/**: written every
#   5 minutes by the cron job / in-flight upload chunks / per-instance
#   regenerable cache (preview/dav/appstore/theming - the preview dir will
#   grow with the photo library, like jellyfin-cache it is disposable).
#   nextcloud/ (config) + the rest of nextcloud-data/ (user files incl.
#   family photos) ARE synced - by decision, unlike /srv/Media.
# - AI phase (2026-10-18): hermes/state.db + joplin-cli profile db are
#   snapshotted (live copies excluded, same class as grafana); openviking
#   *.db (its queue/audit DBs AND the vector index - torn mid-write copies
#   would fail the sync) are snapshotted/excluded, a corrupt index rebuilds
#   via `ov reindex`; joplin-export/** is fully regenerable (the next */5
#   job run rebuilds it) and skipped to save B2 churn. hermes/installs
#   (plugin dependency cache) IS synced - it saves restore-time downloads.
#   joplin-cli/npm/** + joplin-cli/npm-cache/** (the CronJob's pinned CLI
#   installs, ~400 MB of node_modules) are regenerable on the next run and
#   excluded; only the joplin profile (its own DB) is worth backing up.
# - OC phase (2026-10-20): openclaw/**/*.sqlite (+ -wal/-shm) - the
#   per-agent + memory-index DBs are snapshotted live (grafana class);
#   the markdown memory source of truth syncs plainly. hermes/openviking
#   trees keep syncing while disabled (revert data).
# - LET phase (2026-10-21): letta/**/*.db + letta/**/*.sqlite - the local
#   backend state (agents, MemFS repositories) is snapshotted live (same
#   class as openclaw); paths under /root/.letta are unpredictable, so the
#   snapshot script + excludes are generic finds. openclaw/hermes/openviking
#   trees keep syncing while disabled (revert data).
# - --delete-excluded (NC-4 fix, 2026-10-13): rclone's --exclude also
#   protects matching DEST files from deletion - the sonarr live-DB copies
#   that caused the failed sync stayed in B2 forever (torn/unusable, but
#   present and confusing a future restore). With --delete-excluded the
#   destination mirrors source-minus-excludes; B2 versioning retains the
#   deleted objects' history, so a fat-fingered exclude is still
#   recoverable from bucket versions.
[Service]
ExecStartPre=/srv/appdata/_scripts/snapshot-sqlite.sh
ExecStartPre=/srv/appdata/_scripts/snapshot-postgres.sh
ExecStart=/usr/bin/rclone sync --delete-excluded /srv/appdata Backblaze:John-System-Backups/appdata --exclude 'prometheus/**' --exclude 'jellyfin-cache/**' --exclude '*/logs/**' --exclude '*.db-wal' --exclude '*.db-shm' --exclude '*.db-journal' --exclude '*.db3-journal' --exclude 'qbittorrent/qBittorrent/ipc-socket' --exclude 'grafana/grafana.db' --exclude 'shoko/Shoko.CLI/SQLite/**' --exclude 'jellyfin/data/jellyfin.db' --exclude 'seerr/db/db.sqlite3' --exclude 'bazarr/db/bazarr.db' --exclude 'home-assistant/home-assistant_v2.db' --exclude 'postgres/**' --exclude 'sonarr/sonarr.db' --exclude 'sonarr/logs.db' --exclude 'radarr/radarr.db' --exclude 'radarr/logs.db' --exclude 'prowlarr/prowlarr.db' --exclude 'prowlarr/logs.db' --exclude 'jellyfin/Shokofin/VFS/**' --exclude 'nextcloud-data/nextcloud.log' --exclude 'nextcloud-data/uploads/**' --exclude 'nextcloud-data/appdata_*/**' --exclude 'hermes/state.db' --exclude 'joplin-cli/profile/database.sqlite' --exclude 'openviking/**/*.db' --exclude 'joplin-export/**' --exclude 'joplin-cli/npm/**' --exclude 'joplin-cli/npm-cache/**' --exclude 'openclaw/**/*.sqlite' --exclude 'openclaw/**/*.sqlite-wal' --exclude 'openclaw/**/*.sqlite-shm' --exclude 'letta/**/*.db' --exclude 'letta/**/*.db-wal' --exclude 'letta/**/*.db-shm' --exclude 'letta/**/*.sqlite' --exclude 'letta/**/*.sqlite-wal' --exclude 'letta/**/*.sqlite-shm'
