# Jellyfin /metrics (enabled in system.xml during Phase 3 migration)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jellyfin
  namespace: media
  labels: { app: jellyfin }
spec:
  selector:
    matchLabels: { app: jellyfin }
  endpoints:
    - { port: http, path: /metrics, interval: 60s }
# Seerr has no /metrics; exposed via its own health only (up via kube probes).
# Traefik metrics (prometheus serviceMonitor, dropped duration histogram):
# configured via the consolidated HelmChartConfig in
# cluster/traefik/helmchartconfig.yaml (the HelmChartConfig is a singleton
# per chart; it must live in exactly one repo location).