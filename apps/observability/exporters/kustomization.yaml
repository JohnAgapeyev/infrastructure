apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - smartctl.yaml
  - exportarr.yaml
  - qbittorrent.yaml
  - jellyfin-traefik.yaml
  - matter.yaml
  # 9c (HA /api/prometheus scrape) - activated 2026-09-30: token in
  # secrets/homeassistant.env, prometheus: block in the migrated HA
  # configuration.yaml (bootstrap/host/phase9c-ha-metrics.sh), HA restarted.
  - home-assistant.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: matter-exporter
    namespace: observability
    files:
      - matter-exporter.py
secretGenerator:
  - name: arr-apikeys
    namespace: observability
    env: ../../../secrets/arr.env
    type: Opaque
  - name: qbittorrent-creds
    namespace: observability
    env: ../../../secrets/qbittorrent.env
    type: Opaque
  # 9c (HA /api/prometheus scrape) - activated 2026-09-30: token in
  # secrets/homeassistant.env, prometheus: block in the migrated HA
  # configuration.yaml (bootstrap/host/phase9c-ha-metrics.sh), HA restarted.
  - name: homeassistant-token
    namespace: home
    env: ../../../secrets/homeassistant.env
    type: Opaque
