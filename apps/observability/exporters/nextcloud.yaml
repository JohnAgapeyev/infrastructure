# nextcloud-exporter (serverinfo API). Auth = the serverinfo APP TOKEN
# (NC 22+ mechanism, `occ config:app:set serverinfo token`), NOT a user
# app password - the exporter sends it with no username, which Nextcloud
# rejects for basic-auth app passwords. Scrapes through the PUBLIC url +
# Traefik: the in-cluster Service hostname is not in trusted_domains and
# Nextcloud would answer 400 "Trusted domain error". Egress path
# observability->Traefik(kube-system)->cloud is allowed by the cloud
# NetworkPolicy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-exporter
  namespace: observability
  labels: { app: nextcloud-exporter }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: nextcloud-exporter }
  template:
    metadata:
      labels: { app: nextcloud-exporter }
    spec:
      containers:
        - name: nextcloud-exporter
          image: ghcr.io/xperimental/nextcloud-exporter:0.9.1
          env:
            - { name: NEXTCLOUD_SERVER, value: "https://nextcloud.home.jg-a.com" }
            - name: NEXTCLOUD_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: nextcloud-exporter-creds, key: NEXTCLOUD_AUTH_TOKEN } }
            # named explicitly: the pod's own Service injects
            # NEXTCLOUD_EXPORTER_SERVICE_HOST/PORT (Docker-link style) - the
            # qbittorrent-exporter lesson
            - { name: NEXTCLOUD_LISTEN_ADDRESS, value: ":9205" }
          ports:
            - { name: http, containerPort: 9205 }
          readinessProbe:
            httpGet: { path: /metrics, port: 9205 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-exporter
  namespace: observability
  labels: { app: nextcloud-exporter }
spec:
  selector: { app: nextcloud-exporter }
  ports:
    - { name: http, port: 9205, targetPort: 9205 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nextcloud-exporter
  namespace: observability
  labels: { app: nextcloud-exporter }
spec:
  selector:
    matchLabels: { app: nextcloud-exporter }
  endpoints:
    - { port: http, interval: 60s }
