# 9c: scrape HA's built-in prometheus integration at /api/prometheus
# (long-lived access token). Selects the (pod-selector) Service in
# apps/home/home-assistant/service.yaml: the hostNetwork pod's IP is
# 10.0.0.4, so the operator discovers endpoint 10.0.0.4:8123 - the same
# address the ha.lan ingress uses.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: home-assistant
  namespace: home
  labels: { app: home-assistant }
spec:
  selector:
    matchLabels: { app: home-assistant }
  endpoints:
    - port: http
      path: /api/prometheus
      interval: 30s
      bearerTokenSecret:
        name: homeassistant-token
        key: HASS_PROMETHEUS_TOKEN
