# exportarr x4: radarr, sonarr, prowlarr, bazarr (API keys from arr-apikeys Secret)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exportarr-radarr
  namespace: observability
  labels: { app: exportarr-radarr }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: exportarr-radarr }
  template:
    metadata:
      labels: { app: exportarr-radarr }
    spec:
      containers:
        - name: exportarr-radarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args: [radarr]
          env:
            - { name: URL, value: "http://radarr.media.svc.cluster.local:7878" }
            - name: APIKEY
              valueFrom: { secretKeyRef: { name: arr-apikeys, key: RADARR_APIKEY } }
            - { name: PORT, value: "9790" }
            - { name: ENABLE_ADDITIONAL_METRICS, value: "true" }
          ports:
            - { name: http, containerPort: 9790 }
---
apiVersion: v1
kind: Service
metadata:
  name: exportarr-radarr
  namespace: observability
  labels: { app: exportarr-radarr }
spec:
  selector: { app: exportarr-radarr }
  ports:
    - { name: http, port: 9790, targetPort: 9790 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr-radarr
  namespace: observability
  labels: { app: exportarr-radarr }
spec:
  selector:
    matchLabels: { app: exportarr-radarr }
  endpoints:
    - { port: http, interval: 60s }
---
