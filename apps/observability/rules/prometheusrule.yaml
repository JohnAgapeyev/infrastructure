# Plan section 11.4 alerts. Pod restart/OOM/reboot alerts come from the
# chart's default rules (upstream PrometheusRule CRDs).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: media-and-storage-rules
  namespace: observability
  labels:
    release: observability
spec:
  groups:
    - name: storage
      rules:
        - alert: HostMdadmDisksFailed
          expr: node_md_disks{state="failed"} > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "mdadm has failed disks ({{ $labels.device }})"
            description: "RAID member failed: {{ $labels.device }} on {{ $labels.instance }}"
        - alert: SrvFilesystemNearlyFull
          expr: node_filesystem_avail_bytes{mountpoint="/srv"} < 500000000000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "/srv below 500 GB free"
            description: "Media array has {{ $value | humanize1024 }} free (< 500 GB). Imports will stall soon."
        # Absolute-value root rule: the chart's percent-based
        # NodeFilesystem* alerts are null-routed in values.yaml (wrong
        # unit on the 22T array), so this carries the / signal instead.
        # 20 GB: k3s state + prometheus TSDB live on / (SSD, 232 GB).
        - alert: RootFilesystemNearlyFull
          expr: node_filesystem_avail_bytes{mountpoint="/"} < 20000000000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "/ below 20 GB free"
            description: "Root filesystem (SSD: k3s state + prometheus TSDB) has {{ $value | humanize1024 }} free. Compaction/ingest will stall."
        - alert: SmartDeviceUnhealthy
          expr: smartctl_device_smart_status != 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "SMART status failed for {{ $labels.device }}"
            description: "smartctl reports non-healthy SMART status for {{ $labels.device }}"
    - name: media
      rules:
        # 2026-10-17: downgraded critical -> warning. Media *arr/Jellyfin
        # outages are never wake-worthy ("morning is fine"), and scrape
        # blips during torrent IO storms made the critical 1h repeat
        # spam the phone. Warning = quiet 24h repeat + resolves silently.
        - alert: MediaServiceDown
          expr: |
            up{job=~"exportarr-(radarr|sonarr|prowlarr|bazarr)|qbittorrent-exporter|jellyfin"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} has been down for >10m"
            description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}"
    - name: home
      rules:
        - alert: MatterServerRestarting
          # Phase 9b: matter-server restarts are the self-heal for "all
          # nodes unavailable" (liveness probe). >2 in 1h means something
          # is systematically wrong (probe too strict, network flapping).
          expr: increase(kube_pod_container_status_restarts_total{namespace="home",container="matter-server"}[1h]) > 2
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "matter-server restarted more than twice in 1h"
            description: "The Matter liveness probe keeps failing; nodes may be persistently unreachable. Check `kubectl -n home logs deploy/matter-server` and the HA Matter integration."
        - alert: MatterNodesUnavailable
          # The 2026-09-30 failure mode: server up, port listening, HA
          # connected, zero restarts - all nodes unavailable for hours.
          # Only the matter-exporter semantic metric sees it.
          expr: matter_nodes_available == 0 and matter_up == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "All Matter nodes unavailable while matter-server is up"
            description: "matter-exporter reports {{ $value | humanize }} available nodes for 5m while the server answers get_nodes. This is the original boot-race failure mode. Check `kubectl -n home logs deploy/matter-server`; a `kubectl -n home rollout restart deploy/matter-server` usually recovers it."
        - alert: MatterServerUnreachable
          # Exporter cannot reach the WS API: pod down, crash-looping or
          # the host network is broken (restart alert covers looping).
          expr: matter_up == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "matter-exporter cannot reach matter-server (10m)"
            description: "The WebSocket API at 10.0.0.4:5580 did not answer for 10 minutes. Check `kubectl -n home get pod -l app=matter-server`."
        - alert: HomeAssistantDown
          # job label is "home-assistant" (the ServiceMonitor name)
          expr: up{job="home-assistant"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Home Assistant scrape is down (10m)"
            description: "Prometheus cannot scrape HA's /api/prometheus endpoint. Check http://nas:8123 and `kubectl -n home logs deploy/home-assistant`."
    - name: cloud
      rules:
        - alert: NextcloudDown
          # semantic: nextcloud_up is the exporter's view of the serverinfo
          # API - the only signal that sees "Traefik fine, pod fine, app
          # broken" (matter-exporter philosophy). absent() covers the
          # exporter itself being gone (target absence != down - the
          # scale-to-0 quirk; the media alerts share that limitation).
          expr: nextcloud_up == 0 or absent(up{job="nextcloud-exporter"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Nextcloud is down (10m)"
            description: "nextcloud-exporter cannot scrape the serverinfo API (or the exporter vanished). Check `kubectl -n cloud get pods`, https://nextcloud.home.jg-a.com/status.php and `kubectl -n observability logs deploy/nextcloud-exporter`."
        - alert: NextcloudScrapeErrors
          # target stays up but the API calls fail (bad/rotated app
          # password, server errors). Adapted from upstream
          # contrib/prometheus-alerts.yaml.
          expr: sum by (cause) (rate(nextcloud_scrape_errors_total[5m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Nextcloud scrape errors ({{ $labels.cause }})"
            description: "nextcloud-exporter reports persistent scrape errors (cause: {{ $labels.cause }}). Most often an expired app password: re-mint via OCS getapppassword and update secrets/nextcloud-exporter.env."
    # ** H2 phase (2026-10-21): the `ai` rule group is UNSUSPENDED -
    # openviking is re-enabled (replicas: 1, ServiceMonitor re-applied -
    # see apps/ai/openviking/kustomization.yaml). OC phase had this
    # commented out while openviking was disabled. **
    - name: ai
      rules:
        - alert: OpenVikingDown
          # AI phase. The openviking ServiceMonitor (apps/ai/openviking,
          # home-assistant in-namespace precedent) scrapes /metrics.
          # Down = Hermes's memory recall degrades (plugin prefetch fails)
          # and joplin-export upserts vanish into job logs. absent() covers
          # the scrape target vanishing (scale-to-0 quirk, NextcloudDown
          # precedent). Warning, not critical: a memory-layer outage is
          # never wake-worthy (2026-10-17 severity reasoning).
          expr: up{job="openviking"} == 0 or absent(up{job="openviking"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OpenViking scrape is down (10m)"
            description: "Prometheus cannot scrape openviking /metrics. Check `kubectl -n ai get pods`, https://openviking.home.jg-a.com/health and `kubectl -n ai logs deploy/openviking`; if the app is healthy but /metrics 404s, metrics are disabled in ov.conf (server.observability.metrics.enabled - 2026-10-21 H2 lesson)."
        - alert: JoplinExportFailingStreak
          # 2026-10-26 lesson: a single failed joplin-export tick is
          # TRANSIENT (that day: a registry.npmjs tarball 404 during the
          # per-run npm install) - the */5 schedule self-heals on the next
          # tick, but the chart's generic KubeJobFailed pages on it
          # anyway. This rule pages only when runs STOP succeeding: two
          # or more failed Job objects inside the 24h
          # ttlSecondsAfterFinished window = a systematic break (bad
          # creds, dead WebDAV target, broken CLI). A one-off blip that
          # the next tick repairs never reaches this.
          expr: count(kube_job_status_failed{namespace="ai", job_name=~"joplin-export-.*"} > 0) >= 2
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "joplin-export has multiple failed runs in 24h"
            description: "At least two joplin-export Job objects failed within the ttl window ({{ $value }} failed jobs) - the */5 schedule is not self-healing. Check `kubectl -n ai get jobs | grep joplin-export`, the latest pod's logs and the run.sh lessons in docs/operations.md (WebDAV creds, netpol, npm 404, backup-storm deadline overrun)."
