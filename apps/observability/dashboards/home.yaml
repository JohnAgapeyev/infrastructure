# Phase 9 home dashboard: Matter node availability (the one metric that
# sees the 2026-09-30 failure mode), exporter/server health, pod restarts,
# memory, HA entity availability / activity / RSS and light brightness
# (9c /api/prometheus scrape; job label is "home-assistant").
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-home
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
data:
  home.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "matter_nodes_available",
              "legendFormat": "Matter nodes available",
              "refId": "A"
            }
          ],
          "title": "Matter nodes available",
          "type": "stat"
        },
