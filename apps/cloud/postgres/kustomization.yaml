apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # same env file as the nextcloud kustomization's nextcloud-env (DB
  # password); separate name so each app dir stays self-contained -
  # qbittorrent-creds precedent (secretGenerator is namespace-local)
  - name: nextcloud-db
    namespace: cloud
    env: ../../../secrets/nextcloud.env
    type: Opaque
