apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - cronjob.yaml
  - service.yaml
  - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # admin + db creds for the first-run autoinstall; postgres/kustomization
  # generates its own copy (nextcloud-db) from the same env file
  - name: nextcloud-env
    namespace: cloud
    env: ../../../secrets/nextcloud.env
    type: Opaque
