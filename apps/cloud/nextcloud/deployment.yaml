apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: cloud
  labels: { app: nextcloud }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: nextcloud }
  template:
    metadata:
      labels: { app: nextcloud }
    spec:
      # the first-run installer exits if postgres/redis are not answering
      # yet; wait like the home apps wait for host networking (busybox
      # precedent)
      initContainers:
        - name: wait-for-deps
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - until nc -z postgres.cloud.svc.cluster.local 5432 && nc -z redis.cloud.svc.cluster.local 6379; do echo waiting for postgres+redis; sleep 2; done
      containers:
        - name: nextcloud
          image: nextcloud:35.0.1-apache
          env:
            # NO install envs here (NEXTCLOUD_ADMIN_*, POSTGRES_*,
            # NEXTCLOUD_TRUSTED_DOMAINS, TRUSTED_PROXIES, OVERWRITE*): with
            # subdir mounts, /var/www/html (incl. version.php) is recreated
            # on every pod start, and the entrypoint would retry
            # `occ maintenance:install` against the already-installed DB
            # until it crash-loops. Install envs are FIRST-RUN ONLY -
            # re-add temporarily for a from-scratch install. Steady-state
            # config lives in the mounted config.php (occ-managed).
            # REDIS_HOST is kept: it only drives the PHP session handler
            # (configure_redis_session), not the installer.
            - { name: REDIS_HOST, value: "redis.cloud.svc.cluster.local" }
            - { name: PHP_UPLOAD_LIMIT, value: 10G }
            # the image's apache layer has its OWN body cap (default 1GiB ->
            # 413 on big WebDAV PUTs); LimitRequestBody needs a plain
            # non-negative integer, max 2GiB-1, so 0 (unlimited) it is -
            # the PHP post_max_size=10G above is the real limit
            - { name: APACHE_BODY_LIMIT, value: "0" }
            - { name: TZ, value: America/Vancouver }
          ports:
            - { name: http, containerPort: 80 }
          # /status.php via kubelet httpGet is rejected by Nextcloud's
          # trusted-domain guard (Host: <pod-ip> -> 400 "Trusted domain
          # error"); httpGet cannot set a Host header. exec-curl against
          # localhost (auto-trusted by the entrypoint) is the semantic
          # probe (matter-server health.py precedent).
          startupProbe:
            exec:
              command: ["curl", "-sf", "http://localhost/status.php"]
            periodSeconds: 10
            failureThreshold: 45
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["curl", "-sf", "http://localhost/status.php"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["curl", "-sf", "http://localhost/status.php"]
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: config, mountPath: /var/www/html/config }
            - { name: custom-apps, mountPath: /var/www/html/custom_apps }
            - { name: data, mountPath: /var/www/html/data }
      volumes:
        # NEVER mount /var/www/html itself: the image owns it (an upgrade
        # replaces the app code); only state subdirs are host-backed.
        # Image runs apache as root master + www-data(33) workers -> dirs
        # are 33:media (create-users.sh, grafana-472 precedent).
        - name: config
          hostPath: { path: /srv/appdata/nextcloud/config, type: Directory }
        - name: custom-apps
          hostPath: { path: /srv/appdata/nextcloud/custom_apps, type: Directory }
        - name: data
          hostPath: { path: /srv/appdata/nextcloud-data, type: Directory }
