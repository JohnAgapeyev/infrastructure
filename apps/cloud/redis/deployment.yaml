apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cloud
  labels: { app: redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          # cache + file locking only - explicitly NO persistence; losing
          # it to a pod restart costs nothing (Nextcloud re-caches)
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
