apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant
  namespace: home
  labels:
    # links this slice to the selectorless Service above
    kubernetes.io/service-name: home-assistant
addressType: IPv4
endpoints:
  - addresses:
      # static host IP (OPNsense DHCP reservation); HA listens on 8123 via
      # hostNetwork - in k3s and in the Docker rollback alike
      - 10.0.0.4
    conditions:
      ready: true
ports:
  - name: http
    port: 8123
    protocol: TCP
