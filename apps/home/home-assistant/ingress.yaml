apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  namespace: home
spec:
  # wildcard *.home.jg-a.com via the Traefik default TLSStore cert;
  # no per-ingress secret needed. HTTP->HTTPS redirect at Traefik.
  tls:
    - hosts:
        - ha.home.jg-a.com
  rules:
    - host: ha.home.jg-a.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port: { number: 8123 }
