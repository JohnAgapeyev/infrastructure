apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: media
spec:
  # wildcard *.home.jg-a.com via the Traefik default TLSStore cert;
  # no per-ingress secret needed. HTTP->HTTPS redirect at Traefik.
  tls:
    - hosts:
        - prowlarr.home.jg-a.com
  rules:
    - host: prowlarr.home.jg-a.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port: { number: 9696 }
