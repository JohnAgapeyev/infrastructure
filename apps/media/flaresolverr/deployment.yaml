apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: flaresolverr }
  template:
    metadata:
      labels: { app: flaresolverr }
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          env:
            - { name: LOG_LEVEL, value: info }
            - { name: TZ, value: America/Vancouver }
          ports:
            - name: http
              containerPort: 8191
          readinessProbe:
            httpGet: { path: /, port: 8191 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8191 }
            periodSeconds: 60
