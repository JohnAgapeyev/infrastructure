apiVersion: v1
kind: ConfigMap
metadata:
  name: unpackerr-config
  namespace: media
data:
  unpackerr.conf: |
    # Unpackerr: extracts archives from Radarr/Sonarr download clients.
    # Doc: https://unpackerr.zip/docs/install/docker/
    [general]
      minimum_interval = 1m

    [global]
      debug = false
      activity = false
      parallel = 1
      delete_after = 5m
      log_queues = 0
      log_file = 0

    [[radarr]]
      url = "http://radarr.media.svc.cluster.local:7878"
      api_key = "{{RADARR_API_KEY}}"
      paths = ["/srv/Media/Torrents/completed/movies"]
      extract_paths = ["/srv/Media/Torrents/completed/movies"]
      delete_orig = false
      delete_files = false
      move_back = false
      protocols = "torrent"

    [[sonarr]]
      url = "http://sonarr.media.svc.cluster.local:8989"
      api_key = "{{SONARR_API_KEY}}"
      paths = ["/srv/Media/Torrents/completed/tv", "/srv/Media/Torrents/completed/anime"]
      extract_paths = ["/srv/Media/Torrents/completed/tv", "/srv/Media/Torrents/completed/anime"]
      delete_orig = false
      delete_files = false
      move_back = false
      protocols = "torrent"

    # Folder watcher for manually-added archives in the manual category dir
    [[folder]]
      path = "/srv/Media/Torrents/completed/manual"
      extract_path = "/srv/Media/Torrents/completed/manual"
      delete_after = 10m
      delete_orig = false
      move_back = false
