apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: unpackerr }
  template:
    metadata:
      labels: { app: unpackerr }
    spec:
      securityContext:
        runAsUser: 955
        runAsGroup: 1003
        fsGroup: 1003
      containers:
        - name: unpackerr
          image: ghcr.io/unpackerr/unpackerr:v0.16.1
          # URLs + API keys come from the unpackerr-apikeys Secret
          # (secrets/unpackerr.env via secretGenerator)
          env:
            - { name: TZ, value: America/Vancouver }
            - { name: UN_SONARR_0_PATHS_0, value: /srv/Media/Torrents/completed/tv }
            - { name: UN_SONARR_0_PATHS_1, value: /srv/Media/Torrents/completed/anime }
            - { name: UN_SONARR_0_PROTOCOLS, value: torrent }
            - { name: UN_RADARR_0_PATHS_0, value: /srv/Media/Torrents/completed/movies }
            - { name: UN_RADARR_0_PROTOCOLS, value: torrent }
            # folder watcher: manually-added archives (category `manual`)
            - { name: UN_FOLDER_0_PATH, value: /srv/Media/Torrents/completed/manual }
            - { name: UN_FOLDER_0_DELETE_AFTER, value: 10m }
            - { name: UN_FOLDER_0_MOVE_BACK, value: "false" }
          envFrom:
            - secretRef:
                name: unpackerr-apikeys
          volumeMounts:
            # ONE mount for library + torrents (hardlink-compatible extraction)
            - { name: media, mountPath: /srv/Media }
      volumes:
        - name: media
          hostPath: { path: /srv/Media, type: Directory }
