apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: bazarr }
  template:
    metadata:
      labels: { app: bazarr }
    spec:
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:1.6.0
          env:
            - { name: PUID, value: "971" }
            - { name: PGID, value: "1003" }
            - { name: UMASK, value: "002" }
            - { name: TZ, value: America/Vancouver }
          ports:
            - name: http
              containerPort: 6767
          volumeMounts:
            - { name: config, mountPath: /config }
            # ONE mount for library + torrents: subtitle ops never cross mounts
            - { name: media, mountPath: /srv/Media }
          readinessProbe:
            httpGet: { path: /, port: 6767 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 6767 }
            periodSeconds: 60
      volumes:
        - name: config
          hostPath: { path: /srv/appdata/bazarr, type: Directory }
        - name: media
          hostPath: { path: /srv/Media, type: Directory }
