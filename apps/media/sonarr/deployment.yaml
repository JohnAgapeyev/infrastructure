apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: sonarr }
  template:
    metadata:
      labels: { app: sonarr }
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.19
          env:
            - { name: PUID, value: "972" }
            - { name: PGID, value: "1003" }
            - { name: UMASK, value: "002" }
            - { name: TZ, value: America/Vancouver }
          ports:
            - name: http
              containerPort: 8989
          volumeMounts:
            - { name: config, mountPath: /config }
            # ONE mount for library + torrents: hardlinks never cross mounts
            - { name: media, mountPath: /srv/Media }
          readinessProbe:
            httpGet: { path: /ping, port: 8989 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: 8989 }
            periodSeconds: 60
      volumes:
        - name: config
          hostPath: { path: /srv/appdata/sonarr, type: Directory }
        - name: media
          hostPath: { path: /srv/Media, type: Directory }
