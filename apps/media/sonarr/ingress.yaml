apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media
spec:
  # wildcard *.home.jg-a.com via the Traefik default TLSStore cert;
  # no per-ingress secret needed. HTTP->HTTPS redirect at Traefik.
  tls:
    - hosts:
        - sonarr.home.jg-a.com
  rules:
    - host: sonarr.home.jg-a.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port: { number: 8989 }
