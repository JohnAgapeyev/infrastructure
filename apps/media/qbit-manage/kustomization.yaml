apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - cronjob.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # qBittorrent WebUI creds for qbm (also generated in observability/ for
  # the exporters; secretGenerator is namespace-local so it must exist in
  # media too)
  - name: qbittorrent-creds
    namespace: media
    env: ../../../secrets/qbittorrent.env
    type: Opaque