apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - configmap.yaml
  # MongoDB (D19): no-auth single instance behind the ai-ns default-deny;
  # librechat is its only client (MONGO_URI in secrets/librechat.env)
  - mongo-deployment.yaml
  - mongo-service.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # SESSION_SECRET / JWT_SECRET / CREDS_KEY+CREDS_IV / MONGO_URI /
  # HERMES_API_KEY (MUST equal Hermes's API_SERVER_KEY, D21) /
  # ALLOW_REGISTRATION (true for first boot, then false - D23).
  # See secrets/librechat.env.example for generation commands.
  - name: librechat-env
    namespace: ai
    env: ../../../secrets/librechat.env
    type: Opaque