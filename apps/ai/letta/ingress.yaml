# Letta App Server ingress (Agent SDK remote backend / WS endpoint - NO
# web UI at /, that path 404s by design; clients are the Letta Agent SDK
# (`createAppServerClient`, authToken = LETTA_APP_SERVER_TOKEN) or an
# OpenAI-compatible client if --openai-api ever gets enabled).
# WS upgrade passes through Traefik (HTTP/1.1 Upgrade over the TLS
# wildcard - same as any WS app). Auth = LETTA_APP_SERVER_TOKEN bearer
# (capability-token ws-auth on the server, 401 otherwise).
# The 2026-10-20 traefik fix (cluster/traefik/helmchartconfig.yaml,
# NodePort + hostPorts 80/443) means real client IPs arrive here - no
# openclaw-style attribution footgun.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: letta
  namespace: ai
spec:
  tls:
    - hosts:
        - letta.home.jg-a.com
  rules:
    - host: letta.home.jg-a.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: letta
                port: { number: 4500 }