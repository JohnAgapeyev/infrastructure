# Letta App Server (letta-code) - LET phase, replacing openclaw as the ai-ns
# agent (openclaw DISABLED - replicas: 0, kept for revert - same pattern as
# hermes/openviking before it; see docs/PLAN.md LET phase + operations.md
# "AI ops" revert runbook).
# Official first-party image: the letta-app-server-deployment repo's
# Dockerfile pins ghcr.io/letta-ai/letta-code (npm releases get a matching
# container via their release automation - the 0.34.20 npm tag had no image
# yet at pin time, 0.34.19 is the newest published). Self-hosting guide:
# persist /root/.letta, set LETTA_APP_SERVER_TOKEN + a model provider key,
# health-check /readyz.
# GO-LIVE LESSON 2026-10-21: the image's DEFAULT command is the interactive
# CLI - it prints help and exits (crash-loop, exit 1). The App Server must
# be started explicitly. `letta server --help` on 0.34.19:
#   - `--listen` with NO url binds LOOPBACK ONLY -> pass
#     ws://0.0.0.0:4500 explicitly (the pod-IP probe lesson came true).
#   - non-loopback listeners REQUIRE `--ws-auth` (+ token file) - the
#     capability token is the LETTA_APP_SERVER_TOKEN secret, which args
#     cannot reference directly, so the shell wrapper below writes it to
#     an emptyDir file first (root-owned tmpfs, 0600, dropped on pod death).
# PORT env alone does NOT configure the bind; --listen does.
# `letta server --backend local` per the self-hosting guide; no --channels
# (D14 lineage: no messaging channels), no --openai-api (attack surface).
# VERIFIED 2026-10-21: /readyz 200 from the kubelet's pod-IP probes; WS
# 101 + bearer token through Traefik (see operations.md for the HTTP/2
# curl pitfall); 401 on bad/missing token.
# Joplin notes: the export tree is mounted READ-ONLY at /mnt/joplin-export
# (D13 lineage) - the agent may read notes via its filesystem tools, but
# there is no openclaw-style indexed search (accepted degradation, owner
# decision at planning); curation stays in Joplin itself.
# All state (agents, MemFS repositories, memory) is /root/.letta ->
# /srv/appdata/letta. The upstream image runs as root (VERIFIED 2026-10-21:
# `id` -> uid=0).
# One server owns the state dir -> replicas: 1 + Recreate.
# LETTA_SKIP_KEYCHAIN_CHECK=1: file-based token persistence (upstream
# .env.example default for containers without a keychain).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: letta
  namespace: ai
  labels: { app: letta }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: letta }
  template:
    metadata:
      labels: { app: letta }
    spec:
      containers:
        - name: letta
          image: ghcr.io/letta-ai/letta-code:0.34.19
          # GO-LIVE LESSON 2026-10-21: the image's default command is the
          # interactive CLI - it prints help and exits (crash-loop, exit 1).
          # Start the App Server explicitly. `--listen <url>` is REQUIRED
          # for a non-loopback bind (no url = loopback only), and
          # non-loopback listeners REQUIRE `--ws-auth` + a token file.
          # Args cannot reference Secrets, so the wrapper writes
          # LETTA_APP_SERVER_TOKEN to a tmpfs file (umask 077, 0600) for
          # --ws-token-file. No --channels (D14 lineage), no --openai-api
          # (attack surface).
          command:
            - /bin/sh
            - -c
            - |
              umask 077
              printf '%s' "$LETTA_APP_SERVER_TOKEN" > /tmp/letta-ws-token
              exec letta server --backend local \
                --listen ws://0.0.0.0:4500 \
                --ws-auth capability-token \
                --ws-token-file /tmp/letta-ws-token
          env:
            - name: LETTA_APP_SERVER_TOKEN
              valueFrom: { secretKeyRef: { name: letta-env, key: LETTA_APP_SERVER_TOKEN } }
            - name: OPENROUTER_API_KEY
              valueFrom: { secretKeyRef: { name: letta-env, key: OPENROUTER_API_KEY } }
            - { name: LETTA_SKIP_KEYCHAIN_CHECK, value: "1" }
          ports:
            - { name: http, containerPort: 4500 }
          # Upstream's documented health endpoint (/readyz is what their
          # Railway/Fly configs check). tcpSocket fallback not needed unless
          # go-live proves otherwise.
          startupProbe:
            httpGet: { path: /readyz, port: 4500 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: 4500 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /readyz, port: 4500 }
            periodSeconds: 30
          resources:
            # Lighter than openclaw (its 4Gi limit was model-catalog +
            # worker-pool specific, 2026-10-20 lesson). VERIFY at go-live;
            # OOMLesson applies - raise the limit before debugging anything
            # else.
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /root/.letta }
            # D13 lineage: read-only - the agent can never modify the
            # owner's notes; curation happens in Joplin itself.
            - { name: joplin-export, mountPath: /mnt/joplin-export, readOnly: true }
            # tmpfs /tmp for the ws capability-token file (see command)
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          hostPath: { path: /srv/appdata/letta, type: Directory }
        - name: joplin-export
          hostPath: { path: /srv/appdata/joplin-export, type: Directory }
        # scratch for the ws capability-token file written by the command
        # wrapper (tmpfs - dies with the pod, never touches the hostPath)
        - name: tmp
          emptyDir: { medium: Memory }