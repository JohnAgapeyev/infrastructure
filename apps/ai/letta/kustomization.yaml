apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  # H2 phase (2026-10-21): ingress.yaml stays in this dir but is NOT
  # applied while the deployment is disabled (replicas: 0) - an Ingress
  # pointing at a Service with no endpoints would just 503 (hermes
  # precedent). Revert = re-add it here.
  # - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # App Server token + the shared OpenRouter key (chat + embeddings -
  # the same key every ai-ns agent has used since the AI phase).
  # No config files: the App Server is env-driven (unlike openclaw, whose
  # openclaw.json was first-run onboard product on the state dir).
  - name: letta-env
    namespace: ai
    env: ../../../secrets/letta.env
    type: Opaque