apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  # LET phase: ingress.yaml stays in this dir but is NOT applied while the
  # deployment is disabled (replicas: 0) - an Ingress pointing at a Service
  # with no endpoints would just 503 (hermes precedent). Revert = re-add it
  # here.
  # - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # Control UI token + the shared OpenRouter key (chat + embeddings).
  # openclaw.json (model choice, memory config) is first-run product on the
  # hostPath - see openclaw.json.example.
  - name: openclaw-env
    namespace: ai
    env: ../../../secrets/openclaw.env
    type: Opaque