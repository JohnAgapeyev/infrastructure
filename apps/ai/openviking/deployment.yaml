# OpenViking context database - Hermes's memory provider (AI-1).
# ** PHASE HISTORY: OC (2026-10-20) DISABLED replicas: 0 (no consumer
# while Hermes was off) -> H2 (2026-10-21) RE-ENABLED replicas: 1 - Hermes
# is back as the ai-ns agent and OpenVikingDown is un-suspended again
# (apps/observability/rules/prometheusrule.yaml). State dir
# /srv/appdata/openviking (ov.conf + workspace) and B2 backups were never
# touched; the image entrypoint watches for ov.conf and starts the server
# by itself - straight boot, no wizard (pin unchanged: v0.5.0). **
# Single instance BY DESIGN: the embedded local vector backend holds an
# exclusive OS file lock on its workspace (`.openviking.lock`) -> replicas: 1
# + Recreate, and NOTHING else may open /srv/appdata/openviking (the
# joplin-export job talks HTTP only).
# The image runs as root (no USER in its Dockerfile). Its entrypoint WATCHES
# for /app/.openviking/ov.conf and starts the server BY ITSELF the moment
# the file appears - NEVER run `openviking-server` manually inside the pod
# (it collides with the managed one: port 1933 + the workspace lock;
# 2026-10-18 lesson). While ov.conf is missing, the image's PENDING health
# server answers every request - including /health - with 503, so the
# startup probe deliberately allows a 30-minute window for the interactive
# `openviking-server init` wizard (300s killed the container 3x mid-wizard
# and aborted the exec session each time).
# First run: `kubectl exec` in, run `openviking-server init`
# (operations.md "AI ops"); steady-state config lives on the hostPath like
# Nextcloud's config.php (first-run-only wizard; the only secrets in
# ov.conf are the root key + OpenRouter key).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: ai
  labels: { app: openviking }
spec:
  # H2 phase (2026-10-21): re-enabled (was 0 = disabled since OC).
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: openviking }
  template:
    metadata:
      labels: { app: openviking }
    spec:
      containers:
        - name: openviking
          image: ghcr.io/volcengine/openviking:v0.5.0
          env:
            # VikingBot off: Hermes is the agent; Bot would need its own
            # identity config and its own API key (docs: in api_key mode a
            # root key is not a data credential)
            - { name: OPENVIKING_WITH_BOT, value: "0" }
            # defaults from the image ENV; repeated for the next reader
            - { name: OPENVIKING_CONFIG_FILE, value: /app/.openviking/ov.conf }
          ports:
            - { name: http, containerPort: 1933 }
          # /health = process liveness. NOTE: it answers 503 the whole
          # time ov.conf is missing (the pending health server - probes
          # and humans are meant to see "waiting for config"), so the
          # startup grace must cover the interactive init session:
          # 180 x 10s = 30 min. /ready is the real "can serve" signal
          # (AGFS/vectordb/embedding checks).
          startupProbe:
            httpGet: { path: /health, port: 1933 }
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: { path: /ready, port: 1933 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 1933 }
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            # ov.conf, ovcli.conf and the workspace all live under this one
            # mount (image default layout - see its Dockerfile)
            - { name: data, mountPath: /app/.openviking }
      volumes:
        - name: data
          hostPath: { path: /srv/appdata/openviking, type: Directory }
