apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  # OC phase: ingress.yaml stays in this dir but is NOT applied while the
  # deployment is disabled (replicas: 0) - an Ingress pointing at a
  # Service with no endpoints would just 503. Revert = re-add it here.
  # - ingress.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  # Dashboard basic auth is MANDATORY on the container's non-loopback bind
  # (upstream hardening; the loopback/no-auth escape hatch was removed).
  # The OpenRouter/OpenViking keys are NOT here - they live in Hermes's own
  # /opt/data/.env, written during first-run setup.
  - name: hermes-dashboard
    namespace: ai
    env: ../../../secrets/hermes.env
    type: Opaque
